<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200">
  <!-- Prsten (ring): 84x84, border 11px, centriran u 100x100 wrapperu -->
  <circle cx="50" cy="50" r="36.5" fill="#0D0D0D" stroke="#FF6B1A" stroke-width="11"/>
  <!-- Vrata (gate): 14x28, top 17 (od vrha prstena), right -7 (probija desno) -->
  <!-- Prsten zauzima x:8-92, y:8-92; gate y = 8+17=25, right edge = 92+7=99, left = 99-14=85 -->

  <!-- Nos (nose): 20x20 (r=10), bottom 6, right 11 od wrappera 100x100 -->
  <!-- cx = 100-11-10 = 79, cy = 100-6-10 = 84 -->
  <circle cx="79" cy="84" r="8" fill="#FF6B1A" stroke="#0D0D0D" stroke-width="4.4"/>
</svg>